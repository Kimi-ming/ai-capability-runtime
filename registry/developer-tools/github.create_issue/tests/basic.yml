name: creates an issue payload
capability: github.create_issue
mode: dry_run
input:
  owner: opencap
  repo: opencap
  title: Add runtime permission engine
  body: Track the V1 policy engine implementation.
  labels:
    - runtime
    - v0.1
expect:
  status: dry_run
  request:
    method: POST
    url: https://api.github.com/repos/opencap/opencap/issues
  permission:
    risk: write
    decision: ask
