name: Capability 提交
description: 提议或提交新的 OpenCap Capability
title: "capability: "
labels: ["capability", "registry"]
body:
  - type: input
    id: capability_id
    attributes:
      label: Capability id
      placeholder: github.create_issue
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 行为
      description: 这个 Capability 会执行什么外部动作，或访问什么外部数据？
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 权限和风险
      description: 请列出 resource、action、risk level 和所需 env var 名称。不要填写真实 token 或密钥。
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 测试
      description: 请说明包含的 dry-run 或 mock test。
    validations:
      required: false
