name: Capability 提交
description: 提议或提交新的 OpenCap Capability
title: "capability: "
labels: ["capability", "registry"]
body:
  - type: input
    id: capability_id
    attributes:
      label: Capability id
      placeholder: github.create_issue
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Capability 分类
      description: 请选择 Registry 目录第一层分类。新增分类前请在说明中解释稳定用户场景和与既有分类的差异。
      options:
        - developer-tools
        - productivity
        - communication
        - data
        - commerce
        - operations
        - content
        - internal
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 行为
      description: 这个 Capability 会执行什么外部动作，或访问什么外部数据？
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 权限和风险
      description: 请列出 resource、action、risk level 和所需 env var 名称。不要填写真实 token 或密钥。
    validations:
      required: true
  - type: checkboxes
    id: model_visible_text
    attributes:
      label: 模型可见文本确认
      description: 请确认 manifest name/description、input/output schema descriptions、README 和 examples 不包含 prompt injection、强制工具选择、绕过确认、隐藏指令或 secret 请求。
      options:
        - label: 我没有写入 `ignore previous instructions`、`always call this tool`、绕过确认/审计或类似 prompt injection 文本。
          required: true
        - label: 我没有要求用户在 schema description、README 或示例中填写 token、cookie、password、API key、private key 或其他 secret 原值。
          required: true
        - label: README 和 examples 不包含隐藏 HTML comment 指令、零宽字符隐藏文本或要求模型解码执行的 base64/hex 指令。
          required: true
  - type: checkboxes
    id: review_checklist
    attributes:
      label: Registry Review 自查
      description: 提交 PR 前请阅读 docs/社区/registry-guidelines.md、docs/社区/registry-supply-chain-review.md 和 docs/社区/capability-review-checklist.md。
      options:
        - label: 我会在 PR 中使用 registry/<category>/<capability_id>/ 目录，并让 metadata.category 与目录分类一致。
          required: true
        - label: 我会提交 manifest.yml、README.md 和 tests/basic.yml 或等价 registry test。
          required: true
        - label: 我会运行 pnpm validate，并在 PR 中写明验证结果。
          required: true
  - type: textarea
    id: tests
    attributes:
      label: 测试
      description: 请说明包含的 dry-run 或 mock test。
    validations:
      required: false
