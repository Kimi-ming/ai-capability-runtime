name: 功能请求
description: 提议新的 OpenCap 产品、开发者体验或运行时能力
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 你希望解决什么具体问题？请描述当前工作流的阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 OpenCap 增加或改变什么？
    validations:
      required: true
  - type: textarea
    id: ai_native_fit
    attributes:
      label: AI 原生适配
      description: 这个功能如何帮助 Capability、Runtime、Registry、MCP Host 或审计/权限链路？
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: 安全和权限影响
      description: 是否涉及新权限、外部网络、凭据、审计或用户确认？不要填写真实 token、密钥或私有数据。
    validations:
      required: false
